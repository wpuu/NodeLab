[project]
name = "nodelab"
version = "0.1.0"
description = "NodeLab: local proxy URI parsing, Mihomo config generation, and redacted probe results"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
nodelab = "nodelab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--import-mode=importlib",
]
