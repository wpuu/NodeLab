name: Offline inventory synthetic acceptance

'on':
  push:
    branches: ['feat/offline-inventory-*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/inventory_demo.py'
      - 'pyproject.toml'
      - '.github/workflows/offline-inventory.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Offline-only acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag, 2026-10-04
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag, 2026-10-04
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Inventory and parser acceptance with fictional inputs
        run: python -m pytest -q tests/test_inventory.py tests/test_inventory_cli.py tests/test_strict_parser.py tests/test_trojan_parser.py tests/test_vless_parser.py tests/test_redaction.py --junitxml=offline-acceptance.xml
      - name: Linux main regression (no real nodes or engine download)
        if: runner.os == 'Linux'
        run: python -m pytest -q --junitxml=offline-regression.xml
      - name: Generate safe synthetic sample and evidence
        run: python scripts/inventory_demo.py --output-dir generated-examples --emit-evidence
